<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<meta name="description" content="LumaChat — fast, simple messaging.">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>LumaChat</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f5;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;height:100vh;overflow:hidden}
.app{height:100vh;display:flex;flex-direction:column;max-width:1180px;margin:auto;background:#101010}
header{height:72px;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid #242424;background:#0b0b0b}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#ffd21a;box-shadow:0 8px 30px #0008}.logo svg{width:31px}
.brand{font-weight:800;font-size:21px;letter-spacing:-.5px}.brand span{color:#ffd21a}
.status{margin-left:auto;font-size:12px;color:#aaa;display:flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%;background:#ffd21a}
.body{display:flex;flex:1;min-height:0}.sidebar{width:350px;border-right:1px solid #242424;background:#111;display:flex;flex-direction:column}.side-top{padding:18px}.search{background:#1a1a1a;border:1px solid #292929;color:white;border-radius:12px;padding:12px 14px;width:100%;outline:none}.tabs{display:flex;gap:7px;margin-top:12px}.tabs button{flex:1;border:0;border-radius:10px;padding:10px;background:#1b1b1b;color:#aaa;cursor:pointer}.tabs button.active{background:#ffd21a;color:#080808;font-weight:800}.list{overflow:auto;padding:0 10px}.chat{display:flex;gap:12px;padding:13px 10px;border-radius:12px;cursor:pointer}.chat:hover,.chat.active{background:#1d1d1d}.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ffd21a,#ff9f00);color:#111;display:grid;place-items:center;font-weight:800;flex:none}.meta{min-width:0;flex:1}.row{display:flex;justify-content:space-between;gap:8px}.name{font-weight:700}.time{font-size:11px;color:#777}.preview{font-size:13px;color:#8f8f8f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}.chathead{height:72px;padding:0 22px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #242424}.chathead .small{font-size:12px;color:#888;margin-top:3px}.messages{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:10px;background:radial-gradient(circle at 70% 0%,#24200b22,transparent 38%),#101010}.bubble{max-width:min(70%,560px);padding:11px 14px;border-radius:16px 16px 16px 5px;background:#202020;line-height:1.4;color:#eee}.bubble.me{margin-left:auto;background:#ffd21a;color:#111;border-radius:16px 16px 5px 16px}.bubble .stamp{font-size:10px;opacity:.55;margin-top:5px;text-align:right}.composer{padding:15px 18px;border-top:1px solid #242424;display:flex;gap:9px;background:#0d0d0d}.composer input{flex:1;background:#1b1b1b;border:1px solid #292929;color:white;border-radius:13px;padding:13px 14px;outline:none}.btn{border:0;border-radius:13px;padding:0 17px;background:#ffd21a;color:#111;font-weight:800;cursor:pointer}.empty{padding:30px;color:#777;text-align:center}
@media(max-width:760px){.sidebar{width:100%;display:none}.sidebar.mobile-show{display:flex}.main{display:none}.main.mobile-show{display:flex}.body{position:relative}.sidebar,.main{position:absolute;inset:0}.sidebar{z-index:2}.main{z-index:3}.back{display:block!important}.bubble{max-width:82%}}
.back{display:none;border:0;background:#1b1b1b;color:white;border-radius:10px;padding:8px 10px;cursor:pointer}
</style>
</head>
<body>
<div class="app">
<header>
<div class="logo"><svg viewBox="0 0 100 100"><path fill="#111" d="M22 30c0-12 10-22 22-22h27c12 0 22 10 22 22v25c0 12-10 22-22 22H51L34 91c-3 2-7 0-6-4l3-10h-1C18 77 8 67 8 55V44c0-8 5-14 14-14z"/><circle cx="38" cy="49" r="5" fill="#ffd21a"/><circle cx="54" cy="49" r="5" fill="#ffd21a"/><circle cx="70" cy="49" r="5" fill="#ffd21a"/></svg></div>
<div class="brand">Luma<span>Chat</span></div><div class="status"><span class="dot"></span>Demo mode</div>
</header>
<div class="body">
<aside class="sidebar mobile-show" id="sidebar">
<div class="side-top"><input class="search" id="search" placeholder="Search chats..." /><div class="tabs"><button class="active" data-tab="chats">Chats</button><button data-tab="friends">Friends</button></div></div>
<div class="list" id="list"></div>
</aside>
<main class="main" id="main">
<div class="chathead"><button class="back" id="back">←</button><div class="avatar" id="headAvatar">AK</div><div><div class="name" id="headName">Arun Kumar</div><div class="small" id="headStatus">online</div></div></div>
<div class="messages" id="messages"></div>
<form class="composer" id="composer"><input id="message" autocomplete="off" placeholder="Write a message..." /><button class="btn">Send</button></form>
</main>
</div>
</div>
<script>
const chats=[
{id:1,name:"Arun Kumar",initials:"AK",preview:"See you tomorrow!",time:"10:42 PM",messages:[["Hey! How are you?","9:58 PM",0],["I'm good! Working on LumaChat.","10:02 PM",1],["Nice 🔥 See you tomorrow!","10:42 PM",0]]},
{id:2,name:"Priya",initials:"P",preview:"That looks amazing!",time:"9:18 PM",messages:[["Did you see the new design?","9:10 PM",0],["Yes, that looks amazing!","9:18 PM",0]]},
{id:3,name:"LumaChat Team",initials:"LT",preview:"Welcome to LumaChat",time:"Yesterday",messages:[["Welcome to LumaChat 👋","Yesterday",0]]}
];
let selected=chats[0];
const list=document.getElementById("list"),messages=document.getElementById("messages");
function renderList(filter=""){list.innerHTML="";chats.filter(c=>c.name.toLowerCase().includes(filter.toLowerCase())).forEach(c=>{const e=document.createElement("div");e.className="chat "+(c.id===selected.id?"active":"");e.innerHTML='<div class="avatar">'+c.initials+'</div><div class="meta"><div class="row"><div class="name">'+c.name+'</div><div class="time">'+c.time+'</div></div><div class="preview">'+c.preview+'</div></div>';e.onclick=()=>openChat(c);list.appendChild(e)})}
function renderMessages(){messages.innerHTML="";selected.messages.forEach(m=>{const e=document.createElement("div");e.className="bubble "+(m[2]?"me":"");e.innerHTML='<div>'+m[0]+'</div><div class="stamp">'+m[1]+'</div>';messages.appendChild(e)});messages.scrollTop=messages.scrollHeight}
function openChat(c){selected=c;document.getElementById("headName").textContent=c.name;document.getElementById("headAvatar").textContent=c.initials;renderList(document.getElementById("search").value);renderMessages();document.getElementById("sidebar").classList.remove("mobile-show");document.getElementById("main").classList.add("mobile-show")}
document.getElementById("search").oninput=e=>renderList(e.target.value);
document.getElementById("composer").onsubmit=e=>{e.preventDefault();const input=document.getElementById("message");const t=input.value.trim();if(!t)return;selected.messages.push([t,new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}),1]);input.value="";renderMessages()};
document.getElementById("back").onclick=()=>{document.getElementById("main").classList.remove("mobile-show");document.getElementById("sidebar").classList.add("mobile-show")};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");if(b.dataset.tab==="friends"){list.innerHTML='<div class="empty">Friends will appear here.<br><br>Connect Supabase to enable real accounts.</div>'}else renderList(document.getElementById("search").value)});
renderList();renderMessages();
</script>
</body>
</html>
